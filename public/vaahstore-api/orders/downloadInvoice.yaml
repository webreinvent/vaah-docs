get:
  tags:
    - Orders
  summary: Download order invoice
  description: >
    Downloads the invoice for a specific order in **PDF format**.
    - Requires the `order ID` in the path.
    - The response is a binary PDF file that can be saved or opened in the browser.
    - The filename is automatically generated using the order's user first name and UUID
      (e.g., `john_order_573fe889.pdf`).
  operationId: downloadOrderInvoice
  parameters:
    - $ref: '../vaahstore.yaml#/components/parameters/id'
    - '$ref': '../vaahstore.yaml#/components/parameters/frontend_ui'
    - '$ref': '../vaahstore.yaml#/components/parameters/selected_store'
    - '$ref': '../vaahstore.yaml#/components/parameters/currency'
  responses:
    '200':
      description: Invoice PDF downloaded successfully
      content:
        application/pdf:
          schema:
            type: string
            format: binary
          example: "%PDF-1.4 ... (binary content)"
    '404':
      description: Order not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              errors:
                type: array
                items:
                  type: string
                example:
                  - Order not found.
