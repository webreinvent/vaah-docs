post:
  tags:
    - Wishlists
  summary: Move wishlist products to cart
  description: >
    Moves one or more products from a user's wishlist (e.g., "save-for-later")
    to their shopping cart.
    Requires specifying the wishlist ID in the path and providing product details
    (with vendor, variation, and quantity) in the request body.
  operationId: moveWishlistToCart
  parameters:
    - $ref: '../vaahstore.yaml#/components/parameters/id'
  requestBody:
    description: "Products to be moved from wishlist to cart."
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            user:
              type: object
              properties:
                id:
                  type: integer
                  description: ID of the user
                  example: 330
            products:
              type: array
              description: List of products to move
              items:
                type: object
                properties:
                  id:
                    type: integer
                    description: Product ID
                    example: 46
                  variation_id:
                    type: integer
                    description: Product variation ID
                    example: 324
                  vendor_id:
                    type: integer
                    description: Vendor ID
                    example: 16
                  quantity:
                    type: integer
                    description: Quantity to move
                    example: 1
        example:
          user:
            id: 330
          products:
            - id: 46
              variation_id: 324
              vendor_id: 16
              quantity: 1
  responses:
    '200':
      description: Wishlist items moved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                $ref: '../vaahstore.yaml#/components/schemas/Wishlist'
              messages:
                type: array
                items:
                  type: string
                example:
                  - Wishlist items moved to cart successfully.
    '400':
      description: Invalid input or no valid products found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              errors:
                type: array
                items:
                  type: string
                example:
                  - User ID is required
                  - No valid items to move
